name: report-failure

# Reusable: open an issue naming the failing source/step, or add a comment to the open one.
on:
  workflow_call:
    inputs:
      workflow_name:
        type: string
        required: true
      failed_source:
        type: string
        default: ""
      failed_step:
        type: string
        default: ""

permissions:
  issues: write

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          FAILED_SOURCE: ${{ inputs.failed_source }}
          FAILED_STEP: ${{ inputs.failed_step }}
        with:
          script: |
            const { WORKFLOW_NAME, FAILED_SOURCE, FAILED_STEP } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const what = FAILED_SOURCE ? `source \`${FAILED_SOURCE}\`` : `step \`${FAILED_STEP || "unknown"}\``;
            const title = `${WORKFLOW_NAME} failed: ${FAILED_SOURCE || FAILED_STEP || "see run"}`;
            const body = [
              `The **${WORKFLOW_NAME}** refresh stopped at ${what} and published nothing.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `Every feed resumes where it left off, so re-running the workflow after the cause is fixed is safe.`,
              ``,
              `---`,
              `_Opened automatically by the refresh workflow._`,
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "refresh-failure", per_page: 50 });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Failed again: ${runUrl}` });
              core.info(`commented on #${existing.number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["refresh-failure"] });
              core.info(`opened #${issue.number}`);
            }
