name: refresh-monthly

# Monthly feeds (OpenStreetMap businesses, Zillow), then rescore and republish.
# Everything is validated before anything is written: transform and score run dry first;
# only when both pass are metrics and scores loaded and the site published. A failure at
# any step opens (or updates) an issue naming the failing source, and nothing is published.
on:
  schedule:
    - cron: "0 9 2 * *" # 2nd of the month, 09:00 UTC
  workflow_dispatch:
    inputs:
      skip_pilot:
        description: "Score without seed/pilot_v0.csv (QA rule 4). Only for a manual run."
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: refresh-monthly
  cancel-in-progress: false

jobs:
  refresh:
    uses: ./.github/workflows/refresh.yml
    with:
      sources: "gazetteer popest tiger zillow osm"
      skip_pilot: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_pilot || false }}
      workflow_name: refresh-monthly
    secrets: inherit
  publish:
    needs: refresh
    uses: ./.github/workflows/publish.yml
    secrets: inherit
  report-failure:
    needs: [refresh, publish]
    if: failure()
    uses: ./.github/workflows/report-failure.yml
    with:
      workflow_name: refresh-monthly
      failed_source: ${{ needs.refresh.outputs.failed_source }}
      failed_step: ${{ needs.refresh.outputs.failed_step }}
    secrets: inherit
