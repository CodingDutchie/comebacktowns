name: refresh-monthly

# Monthly feeds (OpenStreetMap businesses, Zillow), then rescore and republish.
# Everything is validated before anything is written: transform and score run dry first;
# only when both pass are metrics and scores loaded and the site published. A failure at
# any step opens (or updates) an issue naming the failing source, and nothing is published.
on:
  schedule:
    # GitHub drops scheduled runs now and then (none fired on 2 Nov 2026), so there are two
    # slots; the guard job skips the second when the month already has a successful refresh.
    # refresh-watchdog.yml opens an issue on the 3rd if neither produced one.
    - cron: "0 9 2 * *"
    - cron: "0 15 2 * *"
  workflow_dispatch:
    inputs:
      skip_pilot:
        description: "Score without seed/pilot_v0.csv (QA rule 4). Only for a manual run."
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: refresh-monthly
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            // Manual runs always go. A scheduled run goes only if no other run of this
            // workflow has succeeded since the start of the current UTC month.
            if (context.eventName !== "schedule") { core.setOutput("run", "true"); return; }
            const now = new Date();
            const monthStart = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1)).toISOString();
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: "refresh-monthly.yml", status: "success", created: `>=${monthStart}`, per_page: 10,
            });
            const done = data.workflow_runs.filter((r) => r.id !== context.runId);
            core.info(done.length ? `already refreshed this month: run ${done[0].id}` : "no successful refresh this month yet");
            core.setOutput("run", done.length ? "false" : "true");
  osm:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    uses: ./.github/workflows/osm-workflow.yml
    with:
      write_queries: true
      wait: true
    secrets: inherit
  refresh:
    needs: [guard, osm]
    # The OSM Workflow is a head start only; run the refresh whatever became of it.
    if: ${{ !cancelled() && needs.guard.outputs.run == 'true' }}
    uses: ./.github/workflows/refresh.yml
    with:
      sources: "gazetteer popest tiger zillow osm"
      skip_pilot: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_pilot || false }}
      workflow_name: refresh-monthly
    secrets: inherit
  publish:
    needs: refresh
    uses: ./.github/workflows/publish.yml
    secrets: inherit
  report-failure:
    needs: [refresh, publish]
    if: failure()
    uses: ./.github/workflows/report-failure.yml
    with:
      workflow_name: refresh-monthly
      failed_source: ${{ needs.refresh.outputs.failed_source }}
      failed_step: ${{ needs.refresh.outputs.failed_step }}
    secrets: inherit
