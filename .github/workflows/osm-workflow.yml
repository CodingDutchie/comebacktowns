name: osm-workflow

# Manual run of the OSM Workflow (worker/src/osm-workflow.ts): publish the Overpass queries
# manifest from the latest TIGER snapshot, then start a Workflow instance that fetches every
# town as a durable step into R2 under the given snapshot date. Nothing in Cloudflare
# schedules it (wrangler.toml has no schedule): refresh-monthly calls this workflow as a
# reusable one with wait=true, so a single GitHub cron drives both. Run by hand to seed or re-run.
on:
  workflow_call:
    inputs:
      as_of:
        type: string
        default: ""
      write_queries:
        type: boolean
        default: true
      wait:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      as_of:
        description: "ISO date for the snapshot key (blank = today, UTC)"
        required: false
        default: ""
      write_queries:
        description: "Publish a fresh queries manifest first"
        type: boolean
        default: true
      wait:
        description: "Poll the instance until it finishes (bounded)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: osm-workflow
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --all-groups
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets are present (values are never printed)
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set in repository secrets"; exit 1; fi
          done
      - name: Publish the queries manifest
        if: ${{ inputs.write_queries }}
        run: |
          args=""
          if [ -n "${{ inputs.as_of }}" ]; then args="--as-of ${{ inputs.as_of }}"; fi
          uv run python -m pipeline.cli osm-queries $args
      - name: Start a Workflow instance
        run: |
          params="{}"
          if [ -n "${{ inputs.as_of }}" ]; then params="{\"as_of\":\"${{ inputs.as_of }}\"}"; fi
          out=$(npx --yes wrangler@4 workflows trigger comebacktowns-osm "$params")
          echo "$out"
          # The instance id, if wrangler prints one; otherwise ask for the latest instance.
          id=$(echo "$out" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || true)
          echo "instance=${id:-latest}" >> "$GITHUB_ENV"
      - name: Wait for the instance (bounded; a miss is filled by the Python ingest)
        if: ${{ inputs.wait }}
        run: |
          # Poll for up to 80 minutes. Whatever the outcome this step does not fail the run:
          # the Workflow is a head start, and the Python osm ingest that follows fetches any
          # town whose file is not in R2. We only report what happened.
          deadline=$(( $(date +%s) + 80*60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            desc=$(npx --yes wrangler@4 workflows instances describe comebacktowns-osm "$instance" 2>&1 || true)
            status=$(echo "$desc" | grep -iE '^\s*status' | head -1 | tr 'A-Z' 'a-z')
            case "$status" in
              *complete*) echo "OSM Workflow instance finished: $status"; exit 0 ;;
              *errored*|*terminated*|*failed*) echo "::warning::OSM Workflow instance ended badly ($status); the Python ingest will fill the gaps"; exit 0 ;;
            esac
            echo "waiting ($status)"; sleep 120
          done
          echo "::warning::OSM Workflow still running after 80 minutes; continuing, the Python ingest will fill the gaps"
